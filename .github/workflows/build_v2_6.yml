name: Build DonateTags v2.6
on:
  push:
    paths:
      - 'build_v2_6/build.request'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify addon
        run: |
          cat build_v2_6/parts/*.txt | tr -d '\r\n' | base64 -d > DonateTags_v2_6_Chat_Fix.mcaddon
          echo '6c51bc9b7c7cc23c0c2892ad327de01a14c611d6a764897f2475559986bc58ed  DonateTags_v2_6_Chat_Fix.mcaddon' | sha256sum -c -
          unzip -t DonateTags_v2_6_Chat_Fix.mcaddon
      - name: Publish download to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DonateTags_v2_6_Chat_Fix.mcaddon
          git diff --cached --quiet || git commit -m 'Publish DonateTags v2.6 add-on'
          git push
